source:
  type: cassandra
  host: scylla2026
  port: 9042
  localDC: datacenter1
  credentials:
    username: dummy
    password: dummy
  keyspace: test
  table: collts_xrev_src
  consistencyLevel: LOCAL_QUORUM
  preserveTimestamps: true
  preserveCollectionTimestamps: true
  splitCount: 8
  connections: 8
  fetchSize: 1000

# ScyllaDB 2026.2 source (element-subscript form only, read with per-element point lookups) and
# Cassandra 5.0 target (collection-wide WRITETIME(col)/TTL(col)): validation compares per-element
# metadata, and copyMissingRows restores it from the source lookups.
target:
  type: scylla
  host: cassandra5
  port: 9042
  localDC: datacenter1
  credentials:
    username: dummy
    password: dummy
  keyspace: test
  table: collts_xrev_dst
  consistencyLevel: LOCAL_QUORUM
  connections: 16
  stripTrailingZerosForDecimals: false

savepoints:
  path: /app/savepoints
  intervalSeconds: 300

validation:
  compareTimestamps: true
  ttlToleranceMillis: 60000
  writetimeToleranceMillis: 1000
  failuresToFetch: 100
  floatingPointTolerance: 0.001
  timestampMsTolerance: 0
  copyMissingRows: true
  repairWritetimeStrategy: source
