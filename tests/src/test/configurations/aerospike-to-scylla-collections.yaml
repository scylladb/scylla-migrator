# Set name must match BasicSetName in BasicMigrationTest.scala
source:
  type: aerospike
  keyMode: string
  hosts:
    - aerospike
  namespace: test
  set: basictest
  schema:
    tags: list<string>
    attrs: map<string,string>

target:
  type: scylla
  host: scylla
  port: 9042
  localDC: datacenter1
  credentials:
    username: dummy
    password: dummy
  keyspace: test
  table: basictest
  consistencyLevel: LOCAL_QUORUM
  connections: 16
  stripTrailingZerosForDecimals: false

savepoints:
  path: /app/savepoints
  intervalSeconds: 300
